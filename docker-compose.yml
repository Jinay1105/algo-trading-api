# EC2 Deployment: Dashboard + Nginx Only
# FastAPI Backend runs on Render at: https://algo-trading-api-mpd1.onrender.com

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8501"
    environment:
      # API_BASE points to Render backend (public HTTPS URL)
      - API_BASE= https://algo-trading-api-mpd1.onrender.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s