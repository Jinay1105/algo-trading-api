events {
    worker_connections 1024;
}

http {
    # Upstream for local Streamlit dashboard only
    upstream dashboard {
        server dashboard:8501;
    }

    server {
        listen 80;
        server_name _;

        # Health check - proxies to local dashboard (nginx health)
        location /health {
            proxy_pass http://dashboard/_stcore/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Dashboard routes - proxy to local Streamlit
        # Streamlit server-side Python calls Render API directly
        location / {
            proxy_pass http://dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}